<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>AWS Serverless con Floci</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Gestor de Archivos</h1>

    <div>
        <input type="file" id="file-input">
        <button id="upload-btn">Subir Archivo</button>
        <p id="status-text"></p>
    </div>
    <hr>
    <div>
        <h2>Estadísticas desde DynamoDB</h2>
        <p>Total de archivos registrados: <strong id="total-archivos">--</strong></p>
        <p>Almacenamiento total: <strong id="total-peso">-- MB</strong></p>
        <button id="refresh-btn">Actualizar</button>
        <br><br>
        <a href="tabla.html">Ver tabla de registros completos</a>
    </div>

    <script src="script.js"></script>
</body>

</html>
